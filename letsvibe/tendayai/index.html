<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TenDayAI — Interactive AI Course | LetsVibe AI Academy</title>
  <meta name="description" content="An interactive 10-day course teaching you to build Custom GPTs, AI automations, and full AI-powered apps with chain prompting. Free, hands-on, learn by doing." />
  <meta property="og:title" content="TenDayAI: Interactive AI Course" />
  <meta property="og:description" content="From beginner to AI builder in 10 days — Custom GPTs, automation, assistants, and AI web apps." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔟</text></svg>" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/tendayai/assets/course.css" />
</head>
<body class="course-body">

  <div class="bg-glow" aria-hidden="true"></div>

  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark">🌊</span>
        <span class="brand-name">LetsVibe<span class="brand-accent">AI</span></span>
      </a>
      <span class="course-crumb">/ TenDayAI</span>
      <div class="nav-progress">
        <div class="nav-progress-track"><div class="nav-progress-fill" id="progress-fill"></div></div>
        <span class="nav-progress-label" id="progress-label">0 / 10 days</span>
      </div>
      <span class="auth-slot" id="auth-slot"></span>
      <a class="btn btn-sm btn-ghost nav-cta" href="/">← Academy</a>
    </div>
  </header>

  <div class="course-layout">
    <!-- sidebar -->
    <aside class="course-sidebar" id="course-sidebar">
      <div class="sidebar-head">
        <h1>TenDayAI</h1>
        <p>Interactive AI Course · Free</p>
      </div>
      <nav class="day-nav" id="day-nav" aria-label="Course days"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-sm btn-ghost" id="reset-progress">Reset progress</button>
      </div>
    </aside>

    <!-- mobile day picker -->
    <div class="day-picker-mobile">
      <select id="day-select" class="select" aria-label="Jump to day"></select>
    </div>

    <!-- main content -->
    <main class="course-main">
      <article id="day-content"></article>
      <div class="day-footer">
        <button class="btn btn-ghost" id="prev-day">← Previous</button>
        <button class="btn btn-primary" id="complete-day">Mark day complete ✓</button>
        <button class="btn btn-ghost" id="next-day">Next →</button>
      </div>
      <p class="course-note">TenDayAI is a first-party course from the LetsVibe AI Academy. Prompts open in the assistant of your choice — no API keys, no accounts required here.</p>
    </main>
  </div>

  <script src="/auth/config.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="/tendayai/assets/course-data.js"></script>
  <script src="/tendayai/assets/course.js"></script>
</body>
</html>
